<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="#07090e" />
  <!-- Outer glowing hexagon -->
  <polygon points="32,6 54,19 54,45 32,58 10,45 10,19" stroke="url(#nexusGrad)" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#glow)"/>
  <!-- Inner geometric core -->
  <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="url(#nexusGrad)" opacity="0.85"/>
  <!-- Central energy node -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" filter="url(#glow)" />
  <!-- Dynamic connector rays -->
  <line x1="32" y1="16" x2="32" y2="6" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line x1="46" y1="40" x2="54" y2="45" stroke="#7f00ff" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="40" x2="10" y2="45" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
</svg>